  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

    .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
    .boot img { width: 150px; height: auto; animation: pulse 1.6s ease-in-out infinite; }

  <app-root>
    <!-- Shown until the app finishes loading -->
    <div class="boot"><img src="/assets/logo.png" alt="Core Vision Software Development"></div>
